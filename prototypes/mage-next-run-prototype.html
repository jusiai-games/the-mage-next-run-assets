const labels = ["타이틀","전투 시작","웨이브 1 전투","주문 보상","카드 장착","웨이브 2 전투","실드 붕괴","재도전","스테이지 클리어"];
const spells = {

};
const game = document.querySelector("#game");
const nav = document.querySelector("#steps");
const preview = document.querySelector("#preview-next");
const announcement = document.querySelector("#announcement");
let state;
let timers = [];

function reset(scene) {
  return {scene,held:scene===5?"burst":null, slots:scene===6?["fire","burst",null]:["fire",null,null],
    selected:scene===5,fireLevel:1,ward:scene>=8?1:0,haste:0,balance:scene===9?82:scene===8?7:67,defeated:0,
    meters:scene===3?{fire:2}:{fire:3,burst:1,lightning:1}};
}
function change(scene, jump=false) {
  timers.forEach(clearTimeout);
  timers = [];
  if (jump) state = reset(scene);
  if (!jump && scene === 6) {state.meters={fire:3,burst:1,lightning:1};state.defeated=0;}
  if (!jump && scene === 7) {state.balance=67;state.ward=0;state.haste=0;}
  if (!jump && scene === 8) {
    state.slots=["fire",null,null];state.held=null;state.fireLevel=1;state.defeated=0;state.meters={fire:3};
  }
  if (!jump && scene === 9) state.balance += 75;
  state.scene = scene;
  render();
  announcement.textContent = labels[scene-1];
}
function element(tag, cls, text) {
  const item=document.createElement(tag);
  item.className=cls;
  if (text) item.textContent=text;
  return item;
}
function action(label, cmd, cls="primary") {
  return '<button type="button" class="'+cls+'" data-act="'+cmd+'">'+label+'</button>';
}
function land() {
  return '<div class="land" aria-hidden="true"><div class="sky"></div><div class="terrain"></div><div class="hedge"></div></div><div class="shade"></div>';
}
function mage(big=false) {
  return (big?"":'<div class="mage-shadow"></div>')+'<img class="actor mage'+(big?" big":"")+'" alt="마법사" src="'+images.mage+'">';
}
function hero(scene) {
  const title=scene===1;
  const heading=title?'<h2><span>THE MAGE</span>NEXT RUN</h2>':'<p class="chapter">스테이지 1</p><h2>초원</h2>';
  return '<div class="scene '+(title?"splash":"intro")+'">'+land()+mage(true)+'<div class="hero-copy">'+heading+'</div><div class="hero-action">'+
    action(title?"게임 시작":"전투 시작",title?"intro":"battle")+'</div></div>';
}
function hud(scene,complete) {
  const maximum=5+state.ward;
  const shield=scene===3?2:scene===8?maximum:3;
  const wave=scene===6?2:1;
  const pips=Array.from({length:maximum},(_,i)=>'<i class="pip'+(i<shield?" live":"")+'"></i>').join("");
  return '<div class="hud"><div><span class="hud-label">스테이지 1 · 초원</span><strong>웨이브 '+wave+'/5'+(complete?" 방어 완료":"")+'</strong></div>'+
    '<div><span class="hud-label">실드</span><div class="shieldstat"><span class="pips" aria-hidden="true">'+pips+'</span><strong>'+shield+'/'+maximum+'</strong></div></div></div>';
}
function enemy(x,y,index,tag) {
  const loc='left:'+x+'%;top:'+y+'%';
  const tagMarkup=tag?'<span class="mobtag '+(tag==="준비"?"alert":"")+'" style="left:'+x+'%;top:'+(y+4)+'%">'+tag+'</span>':"";
  return '<div data-enemy="'+index+'" '+(index<state.defeated?"hidden":"")+'><span class="mob-shadow" style="left:'+x+'%;top:'+(y+4)+'%"></span>'+
    '<img class="actor mob" alt="슬라임" style="'+loc+'" src="'+(tag==="준비"?images.attack:images.slime)+'">'+tagMarkup+'</div>';
}
function field(scene) {
  const complete=scene===4||scene===5;
  let foes="";
  if (scene===3) foes=enemy(33,68,0,"준비")+enemy(50,76,1,"준비")+enemy(78,82,2,"대기");
  if (scene===6) foes=enemy(50,73,0)+enemy(69,84,1)+enemy(80,58,2);
  if (scene===8) foes=enemy(68,76,0)+enemy(83,66,1);
  const initialBolt=scene===3?'<span class="fx bolt magic" style="animation:none;opacity:.9" aria-hidden="true"></span>':"";
  return '<div class="scene meadow">'+land()+hud(scene,complete)+mage()+'<div class="barrier'+(scene===3?" weak":"")+'" aria-hidden="true"></div>'+foes+initialBolt+
    (complete?'<p class="field-notice">웨이브 1 방어 완료 · 실드 +1</p>':"")+'</div>';
}
function card(key, mode, index) {
  if (!key) {
    const available=mode==="equip"&&state.selected&&state.held;
    return '<button type="button" class="card empty'+(available?" available":"")+'" data-act="equip-'+index+'" aria-label="'+(index+1)+'번 슬롯, 빈 슬롯" '+(available?"":"disabled")+'><span class="plus">+</span><strong>빈 슬롯</strong></button>';
  }
  const spell=spells[key];
  const reward=mode==="reward";
  const equipping=mode==="equip";
  const cmd=reward?"reward-"+key:equipping?"":"cast-"+key;
  const charge=state.meters[key]??spell.meter;
  const meter=Array.from({length:5},(_,i)=>'<i class="'+(i<charge?"lit":"")+'"></i>').join("");
  return '<button type="button" class="card '+key+'" data-act="'+cmd+'" '+(equipping?"disabled":'aria-label="'+spell.name+(reward?" "+spell.type:" 시전")+'"')+'><span class="card-icon" aria-hidden="true">'+spell.icon+'</span>'+
    '<strong>'+spell.name+'</strong>'+(reward?'<span class="tag">'+spell.type+'</span><small>'+spell.note+'</small>':
    equipping?'<small>Lv.'+(key==="fire"?state.fireLevel:1)+'</small>':'<span class="charge" aria-label="충전 '+charge+'/5">'+meter+'</span>')+'</button>';
}
function dock(scene) {
  const reward=scene===4;
  const equip=scene===5;
  const title=reward?"주문 보상":equip?"장착 슬롯":"장착 주문";
  const meta=reward?"한 장 선택":equip?"웨이브 1 종료":"";
  const cards=reward?["lightning","fire","burst"]:state.slots;
  const mode=reward?"reward":equip?"equip":"battle";
  let inventory="";
  if (equip) {
    const held=state.held;
    const equipped=state.slots.find(key=>key&&key!=="fire");
    const content=held?'<button type="button" data-act="select" aria-pressed="'+state.selected+'">'+spells[held].name+' Lv.1</button>'+
      (state.selected?"<span>빈 슬롯을 눌러 장착</span>":""):equipped?"<span>"+spells[equipped].name+" 장착 완료</span>":"<span>화염탄 Lv."+state.fireLevel+"</span>";
    inventory='<div class="inventory"><span>보유 카드</span>'+content+'</div><div class="dock-actions">'+action("다음 웨이브","next")+'</div>';
  }
  return '<div class="dock '+(equip?"equip":"")+'"><div class="dock-head"><h2>'+title+'</h2><span>'+meta+'</span></div><div class="cards">'+
    cards.map((key,index)=>card(key,mode,index)).join("")+'</div>'+inventory+'</div>';
}
function result(win) {
  const row=(name,value,cls="")=>'<div class="amount '+cls+'"><span>'+name+'</span><strong>'+value+'</strong></div>';
  const upgrade=(type,title,desc,owned)=>'<button type="button" class="upgrade" data-act="buy-'+type+'" '+(owned||state.balance<60?"disabled":"")+'><span><strong>'+title+'</strong><small>'+desc+'</small></span><em>'+ (owned?"구매 완료":"60개")+'</em></button>';
  const shop=win?"":'<div class="shop">'+upgrade("ward","최대 방어막 · Lv.0 → Lv.1","실드 5칸 → 6칸",state.ward)+
    upgrade("haste","주문 쿨타임 · Lv.0 → Lv.1","기본 쿨타임 대비 −5%",state.haste)+'</div>';
  const balance=(win?"":row("이전 잔액",35))+row("이번 도전",win?"+75 잔재":"+32 잔재")+
    row("보유 마력 잔재",state.balance,"total");
  return '<div class="scene outcome '+(win?"win":"")+'">'+land()+'<div class="result">'+(win?'<div class="crest" aria-hidden="true">✦</div>':"")+
    '<h2>'+(win?"스테이지 1 클리어":"실드 붕괴")+'</h2><p class="sub">'+(win?"방어 완료 · 5/5 웨이브":"스테이지 1 · 웨이브 3/5")+'</p>'+
    '<div class="balance">'+balance+'</div>'+shop+action("다시 도전",win?"replay":"retry")+'</div></div>';
}
function render() {
  const scene=state.scene;
  game.innerHTML=scene<=2?hero(scene):scene===7||scene===9?result(scene===9):field(scene)+dock(scene);
  nav.innerHTML=labels.map((label,index)=>'<button type="button" class="step" data-jump="'+(index+1)+'" '+(index+1===scene?'aria-current="step"':"")+'><b>'+String(index+1).padStart(2,"0")+'</b><span>'+label+'</span></button>').join("");
  const shortcuts={3:["방어 완료 장면 보기","done"],6:["실패 결과 보기","failed"],8:["클리어 결과 보기","clear"]};
  const shortcut=shortcuts[scene];
  preview.innerHTML=shortcut?action(shortcut[0],shortcut[1],"skip"):"";
}
function cast(key,button) {
  if (![3,6,8].includes(state.scene)||button.disabled) return;
  const scene=state.scene;
  const targetScene=game.querySelector(".meadow");
  const caster=game.querySelector(".mage");
  const fx=element("div","fx "+(key==="fire"?"bolt":"blast "+(key==="lightning"?"electric":"")),key==="fire"?"":spells[key].icon);
  fx.setAttribute("aria-hidden","true");
  const ready=state.meters[key]??spells[key].meter;
  state.meters[key]=0;
  button.disabled=true;
  button.querySelectorAll(".charge i").forEach(segment=>segment.classList.remove("lit"));
  caster.classList.add("cast");
  targetScene.querySelector(".magic")?.remove();
  targetScene.append(fx);
  const count=scene===3?3:scene===8?2:0;
  const hit=count?targetScene.querySelector('[data-enemy="'+state.defeated+'"]'):null;
  if (hit) state.defeated++;
  timers.push(setTimeout(()=>{
    if (hit) hit.querySelector(".mob").classList.add("hit");
  },180));
  timers.push(setTimeout(()=>{
    fx.remove();
    caster.classList.remove("cast");
    if (hit) hit.hidden=true;
    if(count&&state.defeated===count) {
      change(scene===3?4:9);
      return;
    }
    state.meters[key]=ready;
    button.querySelectorAll(".charge i").forEach((segment,index)=>segment.classList.toggle("lit",index<ready));
    button.disabled=false;
  },state.haste?620:650));
  announcement.textContent=spells[key].name+" 시전";
}
game.addEventListener("click",event=>{
  const button=event.target.closest("[data-act]");
  if (!button) return;
  const cmd=button.dataset.act;
  if (cmd.startsWith("cast-")) return cast(cmd.slice(5),button);
  if (cmd.startsWith("reward-")) {
    const key=cmd.slice(7);
    if (key==="fire") {state.fireLevel=2;state.held=null;}
    else {state.held=key;state.selected=true;}
    return change(5);
  }
  if (cmd==="select") {state.selected=!state.selected;render();game.querySelector('[data-act="select"]').focus();return;}
  if (cmd.startsWith("equip-")) {
    const index=Number(cmd.slice(6));
    if (!state.selected||!state.held||state.slots[index]) return;
    const item=state.held;
    state.slots[index]=item;state.held=null;state.selected=false;render();announcement.textContent=spells[item].name+" 장착 완료";
    game.querySelector('[data-act="next"]').focus();
    return;
  }
  if (cmd.startsWith("buy-")) {
    const key=cmd.slice(4);
    if (state.balance<60||state[key]) return;
    state[key]=1;state.balance-=60;render();
    announcement.textContent="강화 구매 완료 · 보유 마력 잔재 "+state.balance;
    game.querySelector('[data-act="retry"]').focus();
    return;
  }
  if (cmd==="replay") {state.slots=["fire",null,null];state.held=null;state.fireLevel=1;change(8);return;}
  const destinations={intro:2,battle:3,next:6,retry:8};
  if (destinations[cmd]) change(destinations[cmd]);
});
nav.addEventListener("click",event=>{
  const button=event.target.closest("[data-jump]");
  if (!button) return;
  change(Number(button.dataset.jump),true);
  nav.querySelector('[aria-current="step"]').focus();
});
preview.addEventListener("click",event=>{
  const button=event.target.closest("[data-act]");
  const destinations={done:4,failed:7,clear:9};
  if (button) change(destinations[button.dataset.act]);
});
change(1,true);
</script>
</body>
</html>
